name: Build models and deploy GitHub Pages

on:
  push:
    branches: [claude/financial-modeling-builder-yue6tr, main]
  schedule:
    - cron: "30 2 * * *"   # nightly refresh of the pre-built models
  workflow_dispatch:

permissions:
  contents: write   # pushes the built site to the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install LibreOffice Calc (formula verification)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libreoffice-calc
      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests (includes LibreOffice recalculation checks)
        working-directory: backend
        run: python -m pytest -q
      - name: Build static frontend
        working-directory: frontend
        env:
          VITE_STATIC: "1"
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Build and verify models for the curated company list
        run: python scripts/build_site.py --out site --frontend-dist frontend/dist
      - name: Publish the site to the gh-pages branch (served by GitHub Pages)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "Deploy site from ${GITHUB_SHA::7} ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
