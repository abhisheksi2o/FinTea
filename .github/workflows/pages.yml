name: Build models and deploy GitHub Pages

on:
  push:
    branches: [claude/financial-modeling-builder-yue6tr, main]
  schedule:
    - cron: "30 2 * * *"   # nightly refresh of the pre-built models
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install LibreOffice Calc (formula verification)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libreoffice-calc
      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests (includes LibreOffice recalculation checks)
        working-directory: backend
        run: python -m pytest -q
      - name: Build static frontend
        working-directory: frontend
        env:
          VITE_STATIC: "1"
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Build and verify models for the curated company list
        run: python scripts/build_site.py --out site --frontend-dist frontend/dist
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
