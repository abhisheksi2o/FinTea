[project]
name = "fintea"
version = "0.1.0"
description = "Formula-driven financial model builder with Excel export"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "openpyxl>=3.1", "requests>=2.31", "pydantic>=2.5"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
